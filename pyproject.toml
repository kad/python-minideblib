[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minideblib"
version = "0.7.0"
description = "Python library and CLI for working with Debian package metadata"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["COPYING"]
authors = [{ name = "Alexander D. Kanevskiy", email = "kad@bifh.org" }]
keywords = ["debian", "apt", "dpkg", "deb", "repository", "appstream", "packaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving :: Packaging",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kad/python-minideblib"
Issues = "https://github.com/kad/python-minideblib/issues"
Changelog = "https://github.com/kad/python-minideblib/blob/master/CHANGES"

[project.optional-dependencies]
zstd = ["zstandard"]
dep11 = ["pyyaml"]

[project.scripts]
minideb = "minideblib.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pyyaml",
    "ruff",
    "ty>=0.0.95",
    "zstandard",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minideblib"]

[tool.hatch.build.targets.sdist]
# tracked project files only: never local work directories or caches
include = [
    "/src",
    "/tests",
    "/examples",
    "/scripts",
    "/debian",
    "/.github",
    "/Makefile",
    "/README.md",
    "/CHANGES",
    "/COPYING",
    "/TODO.md",
    "/cliff.toml",
    "/pyproject.toml",
    "/python-minideblib.spec",
    "/uv.lock",
    "/.gitignore",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests needing network access (run with MINIDEB_NETWORK=1)"]

[tool.ty.environment]
python-version = "3.11"
root = ["src", ".", "scripts"]

[tool.ty.src]
include = ["src", "tests", "examples", "scripts"]
